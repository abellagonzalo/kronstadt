# Seam 2: the lsp adapter and the server against a real kotlin-lsp. Slow, so separate from Build.
# The kotlin-lsp Homebrew cask should match the tested version in the README (ADR 0001).
name: Contract tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@v4
      - name: Install kotlin-lsp
        run: |
          brew install --cask kotlin-lsp
          brew list --cask --versions kotlin-lsp
      - run: ./gradlew :lsp:contractTest :server:contractTest
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-reports
          path: '**/build/reports/tests/'

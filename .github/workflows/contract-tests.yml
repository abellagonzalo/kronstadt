# Seam 2: the lsp adapter and the server against a real kotlin-lsp. Slow, so separate from Build.
# macOS because Index Seeds call clonefile(2) and renamex_np(2).
# KOTLIN_LSP_VERSION is the tested version in the README (ADR 0001); bump both together.
name: Contract tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      KOTLIN_LSP_VERSION: 271.2085.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Install kotlin-lsp
        run: |
          brew install --cask kotlin-lsp
          installed=$(brew list --cask --versions kotlin-lsp | awk '{print $2}')
          if [ "$installed" != "$KOTLIN_LSP_VERSION" ]; then
            echo "::error::Homebrew installed kotlin-lsp $installed, but Kronstadt is tested against $KOTLIN_LSP_VERSION"
            exit 1
          fi
      - run: ./gradlew :lsp:contractTest :server:contractTest
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: contract-test-reports
          path: '**/build/reports/tests/'
